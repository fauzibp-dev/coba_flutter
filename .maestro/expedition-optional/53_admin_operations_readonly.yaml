appId: com.fauzibondanp.shopmart
name: "Admin toko - modul operasional"
tags:
  - admin
  - optional
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Admin.*"
- extendedWaitUntil:
    visible: "KKMP Kerten Admin"
    timeout: 20000
- assertVisible: "KKMP Kerten Admin"
- tapOn: "Operasional"
- extendedWaitUntil:
    visible: "Operasional"
    timeout: 20000
- takeScreenshot: opt-53-admin-ops
