appId: com.fauzibondanp.shopmart
name: "Super Admin - form voucher tanpa simpan"
tags:
  - superadmin
  - optional
  - validation
  - auth
  - store-required
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 20000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Voucher & Banner"
    direction: DOWN
    timeout: 18000
- tapOn: "Voucher & Banner"
- extendedWaitUntil:
    visible: "Promo & Banner"
    timeout: 20000
- assertVisible: "Promo & Banner"
- tapOn: "Voucher"
- extendedWaitUntil:
    visible: "Kode *"
    timeout: 20000
- assertVisible: "Nilai diskon *"
- takeScreenshot: opt-58-voucher-form
- tapOn: "Batal"
- assertVisible: "Promo & Banner"
