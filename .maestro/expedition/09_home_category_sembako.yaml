appId: com.fauzibondanp.shopmart
name: "Home - navigasi kategori Sembako"
tags:
  - customer
  - catalog
  - data-dependent
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- assertVisible: "Kategori.*"
- tapOn: "Sembako"
- extendedWaitUntil:
    visible: "Sembako"
    timeout: 20000
- assertVisible: "Sembako"
- takeScreenshot: exp-09-sembako
