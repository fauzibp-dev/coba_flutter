appId: com.fauzibondanp.shopmart
name: "Pencarian - urut produk terbaru"
tags:
  - customer
  - search
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Cari Produk"
    timeout: 20000
- assertVisible: "Pencarian"
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Paling relevan"
- tapOn: "Terbaru"
- assertVisible: "Terbaru"
- takeScreenshot: exp-12-sort-newest
