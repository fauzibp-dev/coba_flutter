appId: com.fauzibondanp.shopmart
name: "Pencarian - reset filter yang diisi"
tags:
  - customer
  - search
  - validation
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Cari Produk"
    timeout: 20000
- assertVisible: "Pencarian"
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Filter"
- extendedWaitUntil:
    visible: "Filter Produk"
    timeout: 20000
- tapOn: "Harga minimum"
- inputText: "10000"
- hideKeyboard
- tapOn: "Terapkan Filter"
- tapOn: "Filter.*"
- assertVisible: "Filter Produk"
- tapOn: "Reset"
- tapOn: "Terapkan Filter"
- assertVisible: "Filter"
- takeScreenshot: exp-15-filter-reset
