appId: com.fauzibondanp.shopmart
name: "Pencarian - istilah tidak ditemukan lain"
tags:
  - customer
  - search
  - validation
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Cari Produk"
    timeout: 20000
- assertVisible: "Pencarian"
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "nomorproduk-kkmp-tidak-ada-98765"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Produk tidak ditemukan"
    timeout: 25000
- assertVisible: "Coba kata kunci.*"
- takeScreenshot: exp-16-empty-state-alt
