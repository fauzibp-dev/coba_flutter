appId: com.fauzibondanp.shopmart
name: "Detail produk - tampilkan ulasan"
tags:
  - customer
  - product
  - data-dependent
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Cari Produk"
    timeout: 20000
- assertVisible: "Pencarian"
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "Beras Premium Kerten"
- pressKey: Enter
- extendedWaitUntil:
    visible: "beras.*Stok.*"
    timeout: 25000
- tapOn: "beras.*Stok.*"
- extendedWaitUntil:
    visible: "Detail Produk"
    timeout: 20000
- assertVisible: "Detail Produk"
- scrollUntilVisible:
    element: "Ulasan Pembeli.*"
    direction: DOWN
    timeout: 18000
- assertVisible: "Ulasan Pembeli.*"
- takeScreenshot: exp-18-product-reviews
