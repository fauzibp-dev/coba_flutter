appId: com.fauzibondanp.shopmart
name: "Keranjang - periksa halaman tanpa perubahan"
tags:
  - customer
  - cart
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Keranjang.*"
- extendedWaitUntil:
    visible: "Keranjang"
    timeout: 15000
- assertVisible: "Keranjang"
- takeScreenshot: exp-19-cart-screen
