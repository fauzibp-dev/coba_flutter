appId: com.fauzibondanp.shopmart
name: "Pesanan - akses riwayat transaksi"
tags:
  - customer
  - orders
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Pesanan.*"
- extendedWaitUntil:
    visible: "Pesanan Saya"
    timeout: 20000
- assertVisible: "Pesanan Saya"
- takeScreenshot: exp-20-orders-screen
