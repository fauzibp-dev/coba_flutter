appId: com.fauzibondanp.shopmart
name: "Alamat - buka form tambah lalu kembali"
tags:
  - customer
  - account
  - validation
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- tapOn: "Alamat tersimpan"
- extendedWaitUntil:
    visible: "Alamat Tersimpan"
    timeout: 20000
- assertVisible: "Alamat Tersimpan"
- tapOn: "Alamat"
- extendedWaitUntil:
    visible: "Tambah Alamat"
    timeout: 20000
- assertVisible: "Nama penerima"
- takeScreenshot: exp-22-address-form
- pressKey: Back
- assertVisible: "Alamat Tersimpan"
