appId: com.fauzibondanp.shopmart
name: "Notifikasi - halaman dan aksi tersedia"
tags:
  - customer
  - notifications
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- tapOn: "Notifikasi"
- extendedWaitUntil:
    visible: "Notifikasi"
    timeout: 20000
- assertVisible: "Baca semua"
- takeScreenshot: exp-27-notifications
