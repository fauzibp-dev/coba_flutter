appId: com.fauzibondanp.shopmart
name: "Super Admin - pencarian SKU tak ditemukan"
tags:
  - superadmin
  - platform
  - validation
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 20000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Katalog Global"
    direction: DOWN
    timeout: 18000
- tapOn: "Katalog Global"
- extendedWaitUntil:
    visible: "Katalog Global"
    timeout: 20000
- assertVisible: "Katalog Global"
- tapOn: "Cari produk / SKU"
- inputText: "SKU-NO-ITEM-UAT-987654321"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Produk tidak ditemukan."
    timeout: 25000
- assertVisible: "Produk tidak ditemukan."
- takeScreenshot: exp-35-sku-not-found
