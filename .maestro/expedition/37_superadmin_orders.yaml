appId: com.fauzibondanp.shopmart
name: "Super Admin - riwayat pesanan global"
tags:
  - superadmin
  - platform
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 20000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Pesanan Global"
    direction: DOWN
    timeout: 18000
- tapOn: "Pesanan Global"
- extendedWaitUntil:
    visible: "Pesanan Global"
    timeout: 20000
- assertVisible: "Pesanan Global"
- assertVisible: "Status"
- takeScreenshot: exp-37-orders
