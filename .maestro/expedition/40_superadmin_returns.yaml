appId: com.fauzibondanp.shopmart
name: "Super Admin - retur dan after sales"
tags:
  - superadmin
  - platform
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 20000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Retur & After Sales"
    direction: DOWN
    timeout: 18000
- tapOn: "Retur & After Sales"
- extendedWaitUntil:
    visible: "Retur & After Sales"
    timeout: 20000
- assertVisible: "Retur & After Sales"
- assertVisible: "Filter toko"
- takeScreenshot: exp-40-returns
