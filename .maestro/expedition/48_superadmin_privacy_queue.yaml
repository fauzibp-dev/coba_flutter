appId: com.fauzibondanp.shopmart
name: "Super Admin - antrean privasi"
tags:
  - superadmin
  - platform
  - privacy
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 20000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Commerce Control Center"
    direction: DOWN
    timeout: 18000
- tapOn: "Commerce Control Center"
- extendedWaitUntil:
    visible: "Commerce Control Center"
    timeout: 20000
- assertVisible: "Commerce Control Center"
- tapOn: "Privacy Queue"
- extendedWaitUntil:
    visible: "Permintaan Privasi"
    timeout: 20000
- assertVisible: "Permintaan Privasi"
- takeScreenshot: exp-48-privacy-queue
