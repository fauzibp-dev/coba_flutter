appId: com.fauzibondanp.shopmart
name: "Super Admin - observasi error log"
tags:
  - superadmin
  - platform
  - observability
  - auth
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 18000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 20000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Error Log Center"
    direction: DOWN
    timeout: 18000
- tapOn: "Error Log Center"
- extendedWaitUntil:
    visible: "Error Log Center"
    timeout: 20000
- assertVisible: "Error Log Center"
- assertVisible: "Uji pencatatan log"
- takeScreenshot: exp-49-error-center
