appId: com.fauzibondanp.shopmart
name: "Ketik beras dan cek hasil produk"
tags:
  - smoke
  - customer
  - search
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 30000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "beras"
- pressKey: Enter
- extendedWaitUntil:
    visible: "beras.*Stok.*"
    timeout: 25000
- assertVisible: "beras.*Stok.*"
- takeScreenshot: fix-02-beras
