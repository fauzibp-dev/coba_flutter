appId: com.fauzibondanp.shopmart
name: "Isi password singkat di dialog lalu batal"
tags:
  - customer
  - account
  - validation
  - auth
  - draft
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 30000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "Keamanan & Preferensi"
    direction: DOWN
    timeout: 20000
- tapOn: "Keamanan & Preferensi"
- extendedWaitUntil:
    visible: "Keamanan & Preferensi"
    timeout: 20000
- assertVisible: "Keamanan Akun"
- tapOn: "Ganti password"
- extendedWaitUntil:
    visible: "Ganti Password"
    timeout: 20000
- tapOn: "Password baru"
- inputText: "abc"
- assertVisible: "Ganti Password"
- takeScreenshot: fix-09-password-entry
- tapOn: "Batal"
- assertVisible: "Keamanan & Preferensi"
