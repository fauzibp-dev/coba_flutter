appId: com.fauzibondanp.shopmart
name: "Input produk dan harga lalu batal"
tags:
  - superadmin
  - auth
  - draft
  - store-required
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 30000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- assertVisible: "Akun"
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 20000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 25000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Katalog Global"
    direction: DOWN
    timeout: 20000
- tapOn: "Katalog Global"
- extendedWaitUntil:
    visible: "Katalog Global"
    timeout: 20000
- assertVisible: "Katalog Global"
- tapOn: "Produk"
- extendedWaitUntil:
    visible: "Tambah Produk Global"
    timeout: 20000
- tapOn: "Nama produk *"
- inputText: "PRODUK UAT DRAFT"
- tapOn: "Harga *"
- inputText: "15000"
- hideKeyboard
- assertVisible: "Tambah Produk Global"
- takeScreenshot: fix-15-product-entry
- tapOn: "Batal"
- assertVisible: "Katalog Global"
