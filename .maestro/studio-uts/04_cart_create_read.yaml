appId: com.fauzibondanp.shopmart
name: "UTS-03 CRUD keranjang create/read dan persistensi"
tags:
  - uts-auth
  - uts-transaction
  - uts-cart
---
# Reset route stack tanpa menghapus data atau sesi login.
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
# CREATE: item yang ada di katalog dimasukkan ke keranjang pelanggan.
# Prasyarat: sudah login, item beras aktif dan berstok.
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "beras"
- pressKey: Enter
- extendedWaitUntil:
    visible: "beras.*Stok.*"
    timeout: 25000
- assertVisible: "beras.*Stok.*"
- tapOn:
    text: "beras.*Stok.*"
- extendedWaitUntil:
    visible: "Detail Produk"
    timeout: 20000
- assertVisible: "Detail Produk"
- assertVisible: "Beli Sekarang"
- tapOn: "Beli Sekarang"
- extendedWaitUntil:
    visible: "Subtotal"
    timeout: 20000
- assertVisible: "Checkout"
- takeScreenshot: uts-03-cart-created
# READ: restart proses Flutter tanpa clearState, lalu buka keranjang lagi.
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Keranjang.*"
- extendedWaitUntil:
    visible: "Subtotal"
    timeout: 20000
- extendedWaitUntil:
    visible: "(?is).*beras.*"
    timeout: 15000
- assertVisible: "(?is).*beras.*"
- assertVisible: "Checkout"
- takeScreenshot: uts-03-cart-persisted
