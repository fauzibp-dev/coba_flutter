appId: com.fauzibondanp.shopmart
name: "UTS-06 Customer lihat detail dan deskripsi produk"
tags:
  - uts-customer
  - uts-read
  - uts-catalog
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "beras"
- pressKey: Enter
- extendedWaitUntil:
    visible: "beras.*Stok.*"
    timeout: 25000
- assertVisible: "beras.*Stok.*"
- tapOn:
    text: "beras.*Stok.*"
- extendedWaitUntil:
    visible: "Detail Produk"
    timeout: 20000
- assertVisible: "Beli Sekarang"
- scrollUntilVisible:
    element: "Deskripsi Produk"
    direction: DOWN
    timeout: 20000
- assertVisible: "Deskripsi Produk"
- takeScreenshot: studio-uts-06-detail-produk

