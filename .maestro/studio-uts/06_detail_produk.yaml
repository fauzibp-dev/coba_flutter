appId: com.fauzibondanp.shopmart
name: "UTS-06 Customer lihat detail dan deskripsi produk"
tags:
  - uts-customer
  - uts-read
  - uts-catalog
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "beras"
- pressKey: Enter
- extendedWaitUntil:
    visible: "beras.*Stok.*"
    timeout: 25000
- assertVisible: "beras.*Stok.*"
- tapOn:
    text: "beras.*Stok.*"
- extendedWaitUntil:
    visible: "Detail Produk"
    timeout: 20000
- assertVisible: "Beli Sekarang"
# Screenshot saat halaman detail benar-benar terbuka sebelum scroll.
- takeScreenshot: studio-uts-06-before-scroll
# Body detail Flutter memakai ListView, sedangkan tombol beli statis di bawah.
# Geser pada area isi, bukan tombol tetap / AppBar.
- swipe:
    start: "50%, 72%"
    end: "50%, 38%"
    duration: 650
# Semantics bisa menggabungkan judul Deskripsi dan isi paragraf.
- scrollUntilVisible:
    element: "(?s).*Deskripsi Produk.*"
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
- assertVisible: "(?s).*Deskripsi Produk.*"
- takeScreenshot: studio-uts-06-detail-produk

