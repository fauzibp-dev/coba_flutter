appId: com.fauzibondanp.shopmart
name: "UTS-11 Customer validasi alamat wajib diisi"
tags:
  - uts-customer
  - uts-validation
  - uts-address
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
# Flow customer berikut memerlukan sesi login aktif.
- assertNotVisible: "Masuk / Daftar"
- scrollUntilVisible:
    element: "Alamat tersimpan.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Alamat tersimpan.*"
- extendedWaitUntil:
    visible: "Alamat Tersimpan"
    timeout: 20000
- tapOn: "Alamat"
- extendedWaitUntil:
    visible: "Tambah Alamat"
    timeout: 20000
- assertVisible: "Nama penerima"
- scrollUntilVisible:
    element: "Simpan Alamat"
    direction: DOWN
    timeout: 20000
# Sengaja kosong: validator Flutter harus mencegah penyimpanan.
- tapOn: "Simpan Alamat"
- assertVisible: "Tambah Alamat"
- scrollUntilVisible:
    element: "Wajib diisi."
    direction: UP
    timeout: 20000
- assertVisible: "Wajib diisi."
- takeScreenshot: studio-uts-11-alamat-kosong

