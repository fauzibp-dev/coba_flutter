appId: com.fauzibondanp.shopmart
name: "UTS-12 Customer buka keamanan dan batal ganti password"
tags:
  - uts-customer
  - uts-validation
  - uts-security
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
# Flow customer berikut memerlukan sesi login aktif.
- assertNotVisible: "Masuk / Daftar"
- scrollUntilVisible:
    element: "Keamanan & Preferensi.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Keamanan & Preferensi.*"
- extendedWaitUntil:
    visible: "Keamanan Akun"
    timeout: 20000
# ListTile accessibility pada Flutter dapat menggabungkan judul + subtitle.
# Karena itu regex DOTALL digunakan, bukan pencocokan teks persis.
- assertVisible: "(?s).*Ganti password.*"
- takeScreenshot: studio-uts-12-before-password-dialog
- tapOn: "(?s).*Ganti password.*"
- extendedWaitUntil:
    visible: "(?s).*Ganti Password.*"
    timeout: 15000
- assertVisible: "Password baru"
- takeScreenshot: studio-uts-12-dialog-password
# Batal tanpa memasukkan password atau mengubah akun.
- tapOn: "Batal"
- assertVisible: "Keamanan Akun"
- assertNotVisible: "Password baru"
- takeScreenshot: studio-uts-12-keamanan

