appId: com.fauzibondanp.shopmart
name: "UTS-13 Customer membuka pusat bantuan"
tags:
  - uts-customer
  - uts-read
  - uts-help
---
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
# Flow customer berikut memerlukan sesi login aktif.
- assertNotVisible: "Masuk / Daftar"
- scrollUntilVisible:
    element: "Pusat Bantuan.*"
    direction: DOWN
    timeout: 20000
- tapOn: "Pusat Bantuan.*"
# AppBar terdiri dari dua Text dalam Column: "Pusat Bantuan" + "KKMP Kerten".
# Regex DOTALL menjaga assertion judul jika Semantics menyatukan keduanya.
- extendedWaitUntil:
    visible: "(?s).*Pusat Bantuan.*"
    timeout: 25000
- assertVisible: "(?s).*Pusat Bantuan.*"
# Pastikan percakapan aktif dan input chat tersedia, bukan sekadar AppBar.
- extendedWaitUntil:
    visible: "Tulis pesan..."
    timeout: 30000
- assertVisible: "Tulis pesan..."
# Tidak mengirim pesan ke CS.
- takeScreenshot: studio-uts-13-chat

