appId: com.fauzibondanp.shopmart
name: "UTS-14 CRUD lengkap keranjang Tes Produk"
tags:
  - uts-customer
  - uts-crud
  - uts-cart
---
# Catatan: flow ini berbeda dari UTS-03 (hanya Create/Read).
# UTS-14 melakukan Create, Read, Update +/-, dan Delete memakai "Tes Produk".
# Untuk menjaga data pelanggan: jika Tes Produk sudah ada di cart, berhenti
# SEBELUM MUTASI sehingga tidak mengubah/menghapus item lama.

- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn: "Keranjang.*"
- extendedWaitUntil:
    visible: "(Subtotal|Keranjang masih kosong)"
    timeout: 25000
# GUARD: kegagalan di sini aman; tidak ada barang yang ditambah/dihapus.
- assertNotVisible: "Tes Produk"
- takeScreenshot: uts-14-cart-before

# CREATE: tambah SATU produk uji ke cart, tanpa membuat order.
- tapOn: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "Tes Produk"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Tes Produk.*Stok.*"
    timeout: 25000
- tapOn: "Tes Produk.*Stok.*"
- extendedWaitUntil:
    visible: "Detail Produk"
    timeout: 20000
- assertVisible: "Beli Sekarang"
- tapOn: "Beli Sekarang"
- extendedWaitUntil:
    visible: "Jumlah Tes Produk: 1"
    timeout: 25000
- assertVisible: "Jumlah Tes Produk: 1"
- takeScreenshot: uts-14-created

# UPDATE (+): ubah kuantitas 1 -> 2, jangan hanya mengetuk tombol.
- tapOn: "Tambah jumlah Tes Produk"
- extendedWaitUntil:
    visible: "Jumlah Tes Produk: 2"
    timeout: 25000
- assertVisible: "Jumlah Tes Produk: 2"
- takeScreenshot: uts-14-updated-plus

# UPDATE (-): ubah kuantitas 2 -> 1 lalu periksa perubahan.
- tapOn: "Kurangi jumlah Tes Produk"
- extendedWaitUntil:
    visible: "Jumlah Tes Produk: 1"
    timeout: 25000
- assertVisible: "Jumlah Tes Produk: 1"
- takeScreenshot: uts-14-updated-minus

# DELETE: HANYA Tes Produk milik flow ini, tidak menghapus seluruh cart.
- tapOn: "Hapus Tes Produk dari keranjang"
- extendedWaitUntil:
    visible: "(Subtotal|Keranjang masih kosong)"
    timeout: 25000
- assertNotVisible: "Jumlah Tes Produk: 1"
- assertNotVisible: "Tes Produk"
- takeScreenshot: uts-14-deleted

# READ: buka ulang aplikasi dan pastikan produk uji tidak muncul lagi.
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn: "Keranjang.*"
- extendedWaitUntil:
    visible: "(Subtotal|Keranjang masih kosong)"
    timeout: 25000
- assertNotVisible: "Tes Produk"
- takeScreenshot: uts-14-delete-persisted
