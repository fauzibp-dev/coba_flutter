# Workspace khusus customer KKMP Kerten.
# Pertahankan 5 flow PASS yang sudah terbukti di perangkat fisik.
# Flow tambahan belum PASS sampai Maestro Studio benar-benar menjalankannya.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "UTS-14 CRUD lengkap keranjang Tes Produk"
    - "UTS-01 Pembukaan aplikasi dan katalog"
    - "UTS-02 Navigasi dan input pencarian"
    - "UTS-05 Kondisi gagal pencarian produk"
    - "UTS-07 Pilih urutan harga terendah"
    - "UTS-06 Customer lihat detail dan deskripsi produk"
    - "UTS-03 CRUD keranjang create/read dan persistensi"
    - "UTS-08 Customer membuka wishlist"
    - "UTS-09 Customer melihat riwayat pesanan"
    - "UTS-10 Customer melihat notifikasi"
    - "UTS-11 Customer validasi alamat wajib diisi"
    - "UTS-12 Customer buka keamanan dan batal ganti password"
    - "UTS-13 Customer membuka pusat bantuan"
