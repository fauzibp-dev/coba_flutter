appId: com.fauzibondanp.shopmart
name: "UTS-05 Kondisi gagal pencarian produk"
tags:
  - uts-smoke
  - uts-validation
---
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Cari nama atau deskripsi produk..."
- inputText: "zzzuatnotfound"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Produk tidak ditemukan"
    timeout: 25000
- assertVisible: "Produk tidak ditemukan"
- assertVisible: "Coba kata kunci.*"
- takeScreenshot: uts-05-invalid-search
