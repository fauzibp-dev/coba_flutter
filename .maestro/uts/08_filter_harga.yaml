appId: com.fauzibondanp.shopmart
name: "UTS-08 Masukkan filter harga lalu terapkan"
tags:
  - uts-extended
  - uts-search
  - uts-validation
---
# Reset route stack tanpa menghapus data atau sesi login.
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Cari produk, promo, atau kategori..."
- extendedWaitUntil:
    visible: "Pencarian"
    timeout: 20000
- assertVisible: "Cari nama atau deskripsi produk..."
- tapOn: "Filter"
- extendedWaitUntil:
    visible: "Filter Produk"
    timeout: 15000
- assertVisible: "Harga minimum"
- tapOn: "Harga minimum"
- inputText: "999999999"
- hideKeyboard
- tapOn: "Terapkan Filter"
- takeScreenshot: uts-08-filter-submitted
- extendedWaitUntil:
    visible: "Produk tidak ditemukan"
    timeout: 25000
- assertVisible: "Produk tidak ditemukan"
- takeScreenshot: uts-08-price-filter

