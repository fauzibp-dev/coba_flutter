appId: com.fauzibondanp.shopmart
name: "UTS-09 Super Admin input SKU tak tersedia"
tags:
  - uts-extended
  - uts-superadmin
  - uts-validation
---
# Reset route stack tanpa menghapus data atau sesi login.
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 20000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Kontrol platform dan seluruh toko"
    timeout: 20000
- takeScreenshot: uts-09-superadmin-dashboard-opened
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 35000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Katalog Global"
    direction: DOWN
    timeout: 20000
- tapOn: "Katalog Global"
- extendedWaitUntil:
    visible: "Katalog Global"
    timeout: 20000
- assertVisible: "Katalog Global"
- tapOn: "Cari produk / SKU"
- inputText: "SKU-UAT-TIDAK-ADA-998877"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Produk tidak ditemukan."
    timeout: 25000
- assertVisible: "Produk tidak ditemukan."
- takeScreenshot: uts-09-superadmin-sku-invalid

