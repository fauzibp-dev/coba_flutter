appId: com.fauzibondanp.shopmart
name: "UTS-10 Super Admin isi draft produk lalu batal"
tags:
  - uts-extended
  - uts-superadmin
  - uts-crud-draft
---
# Reset route stack tanpa menghapus data atau sesi login.
- stopApp
- pressKey: Home
- tapOn: "KKMP Kerten"
- extendedWaitUntil:
    visible: "Beranda.*"
    timeout: 25000
- tapOn:
    text: "Beranda.*"
- extendedWaitUntil:
    visible: "Belanja Lebih Mudah Di KKMP Kerten"
    timeout: 25000
- assertVisible: "Belanja Lebih Mudah Di KKMP Kerten"
- tapOn: "Akun.*"
- extendedWaitUntil:
    visible: "Akun"
    timeout: 20000
- scrollUntilVisible:
    element: "KKMP Kerten Super Admin.*"
    direction: DOWN
    timeout: 20000
- tapOn: "KKMP Kerten Super Admin.*"
- extendedWaitUntil:
    visible: "Kontrol platform dan seluruh toko"
    timeout: 20000
- takeScreenshot: uts-10-superadmin-dashboard-opened
- extendedWaitUntil:
    visible: "Platform Control Center"
    timeout: 35000
- assertVisible: "Platform Control Center"
- scrollUntilVisible:
    element: "Katalog Global"
    direction: DOWN
    timeout: 20000
- tapOn: "Katalog Global"
- extendedWaitUntil:
    visible: "Katalog Global"
    timeout: 20000
- assertVisible: "Katalog Global"
- tapOn: "Produk"
- extendedWaitUntil:
    visible: "Tambah Produk Global"
    timeout: 20000
- assertVisible: "Nama produk *"
- tapOn: "Nama produk *"
- inputText: "PRODUK UTS DRAFT VIDEO"
- hideKeyboard
- tapOn: "Harga *"
- inputText: "15000"
- hideKeyboard
- assertVisible: "Tambah Produk Global"
- takeScreenshot: uts-10-product-draft
- tapOn: "Batal"
- assertVisible: "Katalog Global"
- takeScreenshot: uts-10-product-cancelled

