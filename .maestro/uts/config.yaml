# Maestro UTS local runner. Set explicit ordering for continuous recording.
# Continue so one independent FAIL does not hide subsequent tests.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 01_startup
    - 02_navigasi_pencarian
    - 07_urutkan_harga
    - 08_filter_harga
    - 05_validasi_pencarian
    - 03_cart_create_read
    - 04_checkout_quote
    - 06_validasi_alamat
    - 09_cari_sku_superadmin
    - 10_draft_produk_superadmin
